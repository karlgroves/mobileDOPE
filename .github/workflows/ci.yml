name: CI Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the workflow level. This job runs `npm ci`, which executes
# dependency lifecycle scripts; without an explicit block, GITHUB_TOKEN inherits the
# repository default and arbitrary postinstall code would run with a possibly
# write-capable token. See issue #45 item 5.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # `--ignore-scripts`: nothing in the lint/type-check/format path needs a
      # dependency's postinstall step to have run, so it is not granted.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run TypeScript type checking
        run: npm run type-check

      # No `continue-on-error`. Verified passing at 0 errors across 29 files when
      # this gate was made real, so enabling it breaks nothing today and stops the
      # count drifting up unnoticed.
      - name: Lint Markdown
        run: npm run markdownlint

      # No `continue-on-error`. Verified exiting 0 against the thresholds in
      # .jscpd.json when this gate was made real. It reports 115 clones today, which
      # is within the configured budget — the point of gating is that exceeding that
      # budget now fails instead of scrolling past in a green log.
      - name: Check for code duplication (jscpd)
        run: npm run lint:cpd:ci

      - name: Upload duplication report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jscpd-report
          path: reports/jscpd/
          retention-days: 30
        if: always()

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Scripts are needed here: jest-expo's transform relies on expo module
      # postinstall output, so the test project cannot run without them. This is the
      # one place in the repo that grants them, which is why the workflow-level
      # `permissions: contents: read` above matters.
      - name: Install dependencies
        run: npm ci

      # Runs the same suites as `npm test` plus the coverageThreshold ratchet in
      # jest.config.js, so a coverage regression fails here. Deliberately not added to
      # `npm run check` (the pre-push gate) -- see #28 phase 1 -- to keep the local
      # feedback loop fast. This adds a step to an existing workflow rather than a new
      # workflow, per ADR-011.
      - name: Run tests with coverage
        run: npm run test:coverage
