name: PR Check

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # actionlint is not on the runner image. Pin the release and verify its
      # checksum rather than piping an install script into a shell.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Same script as `npm run lint:workflows` and the pre-push hook (#249).
      - name: Validate workflow syntax
        run: bash scripts/lint-workflows.sh

  # The `ci-check` job was REMOVED.
  #
  # It ran `npm ci --ignore-scripts`, `npm run lint` and `npm test` with
  # `continue-on-error: true` on every single step, so the job could not fail no
  # matter what it found — it rendered a green check that meant nothing. Worse, it
  # duplicated work `ci.yml` already does for real (lint, type-check, test with
  # coverage), so it spent Actions minutes to produce a misleading signal.
  #
  # Deleting it loses no coverage: `ci.yml` runs the same checks on the same
  # `pull_request` trigger and those runs can actually fail. The `validate-workflows`
  # job above is kept because it is genuinely additive and does gate (`exit 1`).
