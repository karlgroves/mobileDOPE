name: PR Check

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate workflow syntax
        run: |
          echo "Validating GitHub Actions workflow files..."
          errors=0

          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            echo "Checking $f..."

            # Basic YAML syntax check
            if ! python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null; then
              echo "ERROR: Invalid YAML in $f"
              errors=$((errors + 1))
            fi

            # Check for required 'on' and 'jobs' keys
            if ! grep -q '^on:' "$f" && ! grep -q "^'on':" "$f" && ! grep -q '^"on":' "$f"; then
              echo "WARNING: Missing 'on' trigger in $f"
            fi

            if ! grep -q '^jobs:' "$f"; then
              echo "WARNING: Missing 'jobs' section in $f"
            fi
          done

          if [ $errors -gt 0 ]; then
            echo "Found $errors workflow file(s) with errors"
            exit 1
          fi

          echo "All workflow files are valid"

  # The `ci-check` job was REMOVED.
  #
  # It ran `npm ci --ignore-scripts`, `npm run lint` and `npm test` with
  # `continue-on-error: true` on every single step, so the job could not fail no
  # matter what it found — it rendered a green check that meant nothing. Worse, it
  # duplicated work `ci.yml` already does for real (lint, type-check, test with
  # coverage), so it spent Actions minutes to produce a misleading signal.
  #
  # Deleting it loses no coverage: `ci.yml` runs the same checks on the same
  # `pull_request` trigger and those runs can actually fail. The `validate-workflows`
  # job above is kept because it is genuinely additive and does gate (`exit 1`).
