name: EAS Build

on:
  push:
    tags:
      - 'v*'

# Least privilege. The build uploads to EAS with its own token; it needs no write
# access to this repository. See issue #45 item 5.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # 8.2.1
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # A native build needs dependency postinstall output, so scripts run here.
      - name: Install dependencies
        run: npm ci

      - name: Build for iOS
        run: eas build --platform ios --profile production --non-interactive

      - name: Build for Android
        run: eas build --platform android --profile production --non-interactive
