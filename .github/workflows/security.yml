name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# No `security-events: write`. GitHub Advanced Security / code scanning is not used
# in this project, so nothing here may upload SARIF to the Security tab. Any scanner
# added later must keep its output as a build artifact and gate on it in-workflow
# instead of uploading it.
permissions:
  contents: read

jobs:
  # Quick scan on every push/PR
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # .nvmrc, matching ci.yml and eas-build.yml. `lts/*` floats onto
          # whatever major is current LTS, and package.json declares
          # engines.node ">=24.15.0" with engine-strict=true in .npmrc — so the
          # day `lts/*` resolves to an older major, `npm ci` fails outright here
          # while the rest of CI stays green.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The gate is `scripts/security-audit.mjs`, not bare `npm audit`. It fails on
      # any high/critical advisory that is not individually waived in
      # security/config/audit-waivers.json, and on any waiver that has expired.
      #
      # This replaces `npm audit --audit-level=high` with `continue-on-error: true`,
      # which was the only gate in this repo that could not fail. The blanket skip
      # existed because ~26 advisories predate any given PR, all transitive through
      # react-native / metro / expo and unfixable without an SDK bump. Waiving them
      # individually -- with a reason, an owner and a 90-day expiry -- keeps them
      # from blocking work while still failing the build the moment a NEW one
      # appears. See security/docs/security-exceptions.md. (Issue #45 item 1.)
      - name: Run dependency audit gate
        run: npm run security:audit

      - name: Run npm audit (JSON output)
        run: npm audit --json > npm-audit-results.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-audit-results
          path: npm-audit-results.json
          retention-days: 30

  # CodeQL was intentionally removed (see docs/adr/011). Do not re-add it here.
  #
  # It previously ran as a `codeql` job on every push and PR to main/develop. Two
  # earlier commits claimed to disable it -- `ffa8c86` ("Disable CodeQL and
  # Dependabot") and `819bb51` ("chore(ci): disable CodeQL, Dependabot, scheduled
  # actions") -- but neither touched this job: `ffa8c86` only deleted
  # .github/dependabot.yml, and `819bb51` only removed this workflow's `schedule:`
  # cron. So it kept running for months after it was believed to be off.
  #
  # SAST coverage is provided locally instead by `npm run security:semgrep`
  # (opt-in, per ADR-011's local-gate-first approach).

  # OWASP Dependency-Check was REMOVED. Do not re-add it in this form.
  #
  # It ran as a manual-only `owasp-dependency-check` job using
  # `dependency-check/Dependency-Check_Action`. Every part of that setup was broken
  # in a way that produced a green, authoritative-looking report while scanning
  # effectively nothing. Verified directly against the action's source:
  #
  #   1. `--noupdate` is HARDCODED in the action's own argument list, at every
  #      revision. dependency-check therefore never populates or refreshes the NVD
  #      database, so it has little or no vulnerability data to match against. A
  #      clean report means "nothing was known", not "nothing was found".
  #   2. The scanner image is ALWAYS floating. At tag 1.1.0 the action is
  #      `image: docker://owasp/dependency-check-action:latest`; on `main` it builds
  #      from a Dockerfile whose first line is `FROM owasp/dependency-check-action:latest`.
  #      Pinning the action to a SHA would not have pinned what actually executes.
  #   3. We pinned it to `@main` — a moving default branch — for a third-party
  #      action that ran in a job holding `security-events: write`.
  #   4. Pinning to the only tagged release (1.1.0) would have been WORSE, not
  #      better: that revision declares only `project`/`path`/`format`/`others`, so
  #      our `out:` and `args:` inputs would have been silently dropped and
  #      `--enableExperimental --nodeAuditAnalyzer --nodePackageSkipDevDependencies false`
  #      would never have reached the scanner at all.
  #   5. It was gated on `github.event_name == 'workflow_dispatch'`, so it only ever
  #      ran when someone clicked it — which, combined with the above, means this
  #      repo has never had meaningful dependency-vulnerability coverage from it.
  #
  # Its `upload-sarif` step was the only reason this workflow requested
  # `security-events: write`; both are gone, and GitHub code scanning stays off.
  #
  # Real coverage instead: the `npm-audit` job above runs on every push and PR, and
  # `npm run security:osv` (osv-scanner) is available locally per ADR-011. Wiring
  # osv-scanner into CI as a genuine replacement is tracked separately.

  # License compliance.
  #
  # Runs on every push and pull request. It was previously gated on
  # `if: github.event_name == 'workflow_dispatch'`, which is the same dead-gate
  # shape this PR removed elsewhere: with nothing scheduled and nobody clicking
  # the button, the job never ran, while still appearing in the workflow as a
  # configured check.
  #
  # It also runs the repository's own `license:check` script rather than
  # redefining the policy here. The previous CI-local definition was
  # `license-checker --failOn 'GPL;AGPL;UNKNOWN'`, which could not fail on GPL.
  # Verified against a fixture tree containing a `GPL-3.0` package and a
  # `(BSD-3-Clause OR GPL-2.0)` package:
  #
  #   license-checker --failOn 'GPL;AGPL;UNKNOWN'          -> exit 0
  #   license-checker-rseidelsohn --onlyAllow '<allowlist>' -> exit 1
  #
  # `--failOn` matches the licence string exactly, so `GPL` never matches
  # `GPL-3.0`. Removing the `|| echo` swallow made the step's exit code count
  # again, but the command underneath it still could not fail on the one thing it
  # named. An allowlist also fails closed on a licence nobody anticipated, which a
  # deny-list by construction cannot.
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # No `npm install -g license-checker`: that pulled an unpinned global
      # package at build time. license-checker-rseidelsohn is already a
      # devDependency, pinned in the lockfile, and installed by the step above.
      - name: Check production licences against the allowlist (blocking)
        run: npm run license:check

      - name: Generate licence report
        if: always()
        run: npx license-checker-rseidelsohn --production --json --out licenses.json

      - name: Upload license report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: license-report
          path: licenses.json
          retention-days: 90
