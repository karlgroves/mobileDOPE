# Critical journey: the field loop.
#
# Start a range session, dial a correction, log a shot, and confirm it reaches
# history. This is the flow CLAUDE.md's field-use constraints are written for --
# gloved, one-tap, minimal depth -- so the assertion that matters is that logging
# a shot takes one tap after the corrections are set.
#
# Transcribed from:
#   docs/use-cases/session/start-session.uc.yaml
#   docs/use-cases/session/record-shots.uc.yaml
#   docs/use-cases/history/browse-logs.uc.yaml
#
# Requires the rifle and load created by rifle-to-dope-card.yaml, so it is not
# tagged destructive: it reads the state that flow leaves behind.
appId: com.mobiledope.app.development
tags:
  - journey
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: 'Mobile DOPE'
    timeout: 30000

# --- Conditions -------------------------------------------------------------
- tapOn: 'Session'
- scrollUntilVisible:
    element: 'Environment'
    direction: DOWN
- tapOn: 'Environment'

# Manual entry, not GPS: the E2E run must not depend on a permission prompt or on
# the simulator having a location fix. See environment-location-denied.yaml for
# the permission path itself.
- tapOn: 'Temperature'
- inputText: '72'
- hideKeyboard
- tapOn: 'Altitude'
- inputText: '5280'
- hideKeyboard

- scrollUntilVisible:
    element: 'Save'
    direction: DOWN
- tapOn: 'Save'

# --- Session ----------------------------------------------------------------
- tapOn: 'Session'
- tapOn: 'Start Session'
- tapOn: 'Tikka T3x'
- tapOn: '175gr SMK'
- tapOn: 'Start'

- assertVisible: 'Tikka T3x'

# --- Record -----------------------------------------------------------------
# The unit is deliberately left off these selectors. The labels now end in the
# shooter's chosen correction unit rather than a fixed "mils" (#166) -- the
# screen used to say MIL whatever Settings said -- so naming a unit here would
# make the flow depend on a setting it does not set. Maestro matches text
# selectors as unanchored patterns, so the prefix finds the same control.
- tapOn: 'Increase elevation correction'
- tapOn: 'Increase elevation correction'
- tapOn: 'Adjust windage correction right'

# One tap from "corrections dialled" to "shot logged". If a confirmation step is
# ever inserted here, this flow fails -- which is the intent.
- tapOn: 'Record shot'
- assertVisible: 'Shots fired, 1'

# --- It reached the log -----------------------------------------------------
- tapOn: 'History'
- assertVisible: 'Tikka T3x'
